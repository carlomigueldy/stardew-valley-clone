name: Task
description: Track workflow, content, or maintenance work
title: "[TASK-ID]: "
labels: ["task"]
body:
  - type: input
    id: task_id
    attributes:
      label: Feature list id
      description: Example SHIP-001
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Coordination notes
      description: Mention ownership, dependencies, or timing risks.
    validations:
      required: false
