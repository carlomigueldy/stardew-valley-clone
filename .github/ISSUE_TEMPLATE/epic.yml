name: Epic
description: Track a large feature area from feature_list.json
title: "[EPIC-]: "
labels: ["epic"]
body:
  - type: input
    id: feature_id
    attributes:
      label: Feature list id
      description: Example EPIC-FARMING
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What player or delivery outcome does this epic enable?
    validations:
      required: true
  - type: textarea
    id: sub_issues
    attributes:
      label: Sub-issues
      description: List child ids from feature_list.json.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: How will completion be verified?
    validations:
      required: true
