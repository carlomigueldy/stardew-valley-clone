name: Feature
description: Implement an issue-sized feature slice
title: "[FEATURE-ID]: "
labels: ["feature"]
body:
  - type: input
    id: feature_id
    attributes:
      label: Feature list id
      description: Example FARM-001
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Copy or link the criteria from feature_list.json.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: owned_paths
    attributes:
      label: Expected paths
      description: List owned paths and paths to avoid.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Commands and manual checks expected for this feature.
    validations:
      required: true
