name: Issue Sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry run or write missing issues
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - write

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ inputs.mode }}" = "write" ]; then
            node scripts/sync-github-issues.mjs --write
          else
            node scripts/sync-github-issues.mjs --dry-run
          fi

      - name: Upload updated feature list
        if: ${{ inputs.mode == 'write' }}
        uses: actions/upload-artifact@v4
        with:
          name: feature-list-with-issue-placeholders
          path: feature_list.json
