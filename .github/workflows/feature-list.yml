name: Feature List

on:
  pull_request:
    paths:
      - feature_list.json
      - agent-harness/schemas/feature-list.schema.json
      - scripts/validate-feature-list.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate feature list
        run: node scripts/validate-feature-list.mjs
