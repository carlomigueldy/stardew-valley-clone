name: Pull Request Hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: Check conventional pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          case "$PR_TITLE" in
            feat:*|fix:*|chore:*|docs:*|refactor:*|test:*|ci:*|build:*|perf:*|revert:*)
              echo "Pull request title is conventional."
              ;;
            *)
              echo "Pull request title should start with a conventional commit prefix."
              exit 1
              ;;
          esac
